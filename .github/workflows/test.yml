name: ZEZ tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    defaults:
      run:
        working-directory: python-games/ZEZ
    env:
      PYGAME_HIDE_SUPPORT_PROMPT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set isolated save location
        run: echo "ZEZ_SAVE_DIR=$RUNNER_TEMP/zez-ci-save" >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python-games/ZEZ/requirements.txt
      - name: Install game dependency
        run: python -m pip install -r requirements.txt
      - name: Test running, boss combat, progression, input and persistence
        run: python -m unittest discover -s tests -v
      - name: Render every scene without a display
        run: |
          for scene in menu run boss pause over workshop contracts perks changelog; do
            python main.py --headless --scene "$scene" --frames 5 --seed 42 --screenshot "$RUNNER_TEMP/zez-$scene.png"
          done
      - name: Render boss combat after its entrance
        run: python main.py --headless --scene boss --frames 240 --seed 42 --screenshot "$RUNNER_TEMP/zez-boss-combat.png"
      - name: Check launch from another working directory
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/python-games/ZEZ/main.py" --headless --scene run --frames 5 --seed 42
      - name: Upload scene previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-previews-python-${{ matrix.python-version }}
          path: ${{ runner.temp }}/zez-*.png
          if-no-files-found: ignore
          retention-days: 7
